name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.12, 22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Run release-quality checks
        run: npm run check

  smoke-package:
    name: Packed CLI smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install and run the packed artifact
        shell: bash
        run: |
          package="$(npm pack --silent)"
          sandbox="$(mktemp -d)"
          npm install --prefix "$sandbox" "$PWD/$package"
          cd "$sandbox"
          npx harnesscheck init
          npx harnesscheck doctor
          npx harnesscheck run --run-id ci-smoke --keep never
          test -s .harnesscheck/reports/ci-smoke/report.json
          test -s .harnesscheck/reports/ci-smoke/report.html
          test -s .harnesscheck/reports/ci-smoke/report.junit.xml
          test -s .harnesscheck/reports/ci-smoke/report.md
