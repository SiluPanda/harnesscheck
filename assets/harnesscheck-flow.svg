<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">HarnessCheck execution flow</title>
  <desc id="desc">A flow diagram showing fixture copy, agent execution, assertion evaluation, and report generation with security boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f9ff" />
      <stop offset="100%" stop-color="#edf2fb" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38c7ff" />
      <stop offset="100%" stop-color="#735cff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#a8b8d9" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="1400" height="800" fill="url(#bg)" />
  <text x="80" y="96" fill="#0f1a30" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="820">HarnessCheck execution model</text>
  <text x="80" y="134" fill="#576987" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">Fixture-first isolation, adapter-aware execution, assertion-driven evidence</text>
  <g transform="translate(80 200)">
    <rect width="220" height="188" rx="28" fill="#ffffff" stroke="#d8e0f0" filter="url(#shadow)" />
    <text x="28" y="50" fill="#0f1a30" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="760">1. Fixture</text>
    <text x="28" y="84" fill="#5d6e8d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Checked-in baseline</text>
    <rect x="28" y="112" width="164" height="42" rx="12" fill="#eff4ff" />
    <text x="46" y="139" fill="#25385f" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15">examples/.../fixture</text>
  </g>
  <g transform="translate(372 200)">
    <rect width="240" height="188" rx="28" fill="#ffffff" stroke="#d8e0f0" filter="url(#shadow)" />
    <text x="28" y="50" fill="#0f1a30" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="760">2. Copy</text>
    <text x="28" y="84" fill="#5d6e8d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Fresh workspace per trial</text>
    <rect x="28" y="112" width="182" height="42" rx="12" fill="#eff4ff" />
    <text x="46" y="139" fill="#25385f" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15">.harnesscheck/run-.../</text>
  </g>
  <g transform="translate(684 200)">
    <rect width="272" height="188" rx="28" fill="#ffffff" stroke="#d8e0f0" filter="url(#shadow)" />
    <text x="28" y="50" fill="#0f1a30" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="760">3. Run adapter</text>
    <text x="28" y="84" fill="#5d6e8d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Prompt + agent + env + timeout</text>
    <g transform="translate(28 114)">
      <rect width="64" height="28" rx="14" fill="#eaf0fe" />
      <text x="15" y="19" fill="#29406d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">CODEX</text>
      <rect x="74" width="76" height="28" rx="14" fill="#eaf0fe" />
      <text x="90" y="19" fill="#29406d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">CLAUDE</text>
      <rect x="160" width="74" height="28" rx="14" fill="#eaf0fe" />
      <text x="176" y="19" fill="#29406d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">GEMINI</text>
    </g>
  </g>
  <g transform="translate(1028 200)">
    <rect width="292" height="188" rx="28" fill="#ffffff" stroke="#d8e0f0" filter="url(#shadow)" />
    <text x="28" y="50" fill="#0f1a30" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="760">4. Assertions</text>
    <text x="28" y="84" fill="#5d6e8d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Files, churn, stdout, stderr, commands</text>
    <text x="28" y="124" fill="#25385f" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">file_exists</text>
    <text x="28" y="150" fill="#25385f" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">changed_files</text>
  </g>
  <g transform="translate(170 504)">
    <rect width="1060" height="180" rx="32" fill="#0d1730" filter="url(#shadow)" />
    <text x="42" y="52" fill="#f7fbff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="760">Security and evidence boundary</text>
    <text x="42" y="88" fill="#9cb0d4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">The source fixture stays immutable; the isolated workspace carries the edits; reports capture the result.</text>
    <g transform="translate(42 116)">
      <rect width="160" height="28" rx="14" fill="#142241" />
      <text x="18" y="19" fill="#d8e4fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">REDACTION DEFAULTS</text>
      <rect x="178" width="146" height="28" rx="14" fill="#142241" />
      <text x="198" y="19" fill="#d8e4fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">OUTPUT BOUNDS</text>
      <rect x="342" width="168" height="28" rx="14" fill="#142241" />
      <text x="362" y="19" fill="#d8e4fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">COPY EXCLUSIONS</text>
      <rect x="528" width="190" height="28" rx="14" fill="#142241" />
      <text x="548" y="19" fill="#d8e4fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">UPSTREAM PERMISSIONS</text>
    </g>
  </g>
  <g stroke="url(#accent)" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M300 294h48" />
    <path d="M612 294h48" />
    <path d="M958 294h48" />
  </g>
  <g fill="url(#accent)">
    <path d="M348 284l18 10-18 10z" />
    <path d="M660 284l18 10-18 10z" />
    <path d="M1006 284l18 10-18 10z" />
  </g>
</svg>
