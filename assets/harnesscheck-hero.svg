<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">HarnessCheck hero</title>
  <desc id="desc">A branded overview graphic showing fixtures flowing through isolated workspaces, coding agents, assertions, and reports.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f" />
      <stop offset="60%" stop-color="#0a1630" />
      <stop offset="100%" stop-color="#11152f" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#61dafb" />
      <stop offset="100%" stop-color="#7c5cff" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1a34" />
      <stop offset="100%" stop-color="#0b1429" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#02050d" flood-opacity="0.45" />
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)" />
  <circle cx="1060" cy="108" r="180" fill="#5d68ff" opacity="0.12" />
  <circle cx="230" cy="620" r="220" fill="#2bd4ff" opacity="0.10" />
  <g transform="translate(72 64)">
    <text x="0" y="78" fill="#f8fbff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="70" font-weight="840" letter-spacing="-1.5">HarnessCheck</text>
    <text x="0" y="128" fill="#a6b8da" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="500">Deterministic, isolated regression tests for AI coding agents</text>
    <text x="0" y="172" fill="#6f86af" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">Codex · Claude Code · Gemini CLI · OpenCode · Custom wrappers</text>
  </g>
  <g transform="translate(72 238)">
    <rect width="260" height="318" rx="28" fill="url(#panel)" stroke="#233455" filter="url(#shadow)" />
    <text x="28" y="46" fill="#f7fbff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="760">Fixture</text>
    <text x="28" y="76" fill="#8fa4ca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Canonical repo snapshot</text>
    <g transform="translate(28 108)">
      <rect width="204" height="168" rx="18" fill="#081222" stroke="#1f3152" />
      <path d="M26 28h72" stroke="#61dafb" stroke-width="8" stroke-linecap="round" />
      <path d="M26 56h148" stroke="#3a507d" stroke-width="8" stroke-linecap="round" />
      <path d="M26 84h134" stroke="#3a507d" stroke-width="8" stroke-linecap="round" />
      <path d="M26 112h90" stroke="#3a507d" stroke-width="8" stroke-linecap="round" />
      <rect x="138" y="120" width="34" height="26" rx="8" fill="#1f3255" />
      <rect x="26" y="124" width="88" height="18" rx="9" fill="#132645" />
    </g>
  </g>
  <g transform="translate(382 218)">
    <rect width="228" height="356" rx="28" fill="url(#panel)" stroke="#233455" filter="url(#shadow)" />
    <text x="28" y="50" fill="#f7fbff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="760">Isolated workspace</text>
    <text x="28" y="80" fill="#8fa4ca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Fresh copy per trial</text>
    <g transform="translate(28 116)">
      <rect width="172" height="58" rx="16" fill="#101d37" stroke="#1c3056" />
      <text x="20" y="36" fill="#dbe8ff" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15">trial-01/</text>
      <rect y="78" width="172" height="58" rx="16" fill="#101d37" stroke="#1c3056" opacity="0.8" />
      <text x="20" y="114" fill="#dbe8ff" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15">trial-02/</text>
      <rect y="156" width="172" height="58" rx="16" fill="#101d37" stroke="#1c3056" opacity="0.6" />
      <text x="20" y="192" fill="#dbe8ff" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15">trial-N/</text>
    </g>
  </g>
  <g transform="translate(660 218)">
    <rect width="250" height="356" rx="28" fill="url(#panel)" stroke="#233455" filter="url(#shadow)" />
    <text x="28" y="50" fill="#f7fbff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="760">Agent run</text>
    <text x="28" y="80" fill="#8fa4ca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Prompt + adapter + env</text>
    <g transform="translate(28 114)">
      <rect width="194" height="46" rx="14" fill="#13223e" />
      <text x="18" y="29" fill="#dbe8ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700">codex</text>
      <rect y="60" width="194" height="46" rx="14" fill="#13223e" />
      <text x="18" y="89" fill="#dbe8ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700">claude</text>
      <rect y="120" width="194" height="46" rx="14" fill="#13223e" />
      <text x="18" y="149" fill="#dbe8ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700">gemini</text>
      <rect y="180" width="194" height="46" rx="14" fill="#13223e" />
      <text x="18" y="209" fill="#dbe8ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700">opencode</text>
    </g>
  </g>
  <g transform="translate(960 218)">
    <rect width="250" height="356" rx="28" fill="url(#panel)" stroke="#233455" filter="url(#shadow)" />
    <text x="28" y="50" fill="#f7fbff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="760">Assertions + reports</text>
    <text x="28" y="80" fill="#8fa4ca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Files, churn, stdout, exit codes</text>
    <g transform="translate(28 116)">
      <rect width="194" height="168" rx="18" fill="#081222" stroke="#1f3152" />
      <path d="M20 30l18 18 34-38" fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round" stroke-width="10" />
      <text x="54" y="42" fill="#e9f1ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">file_exists</text>
      <text x="54" y="72" fill="#9cb2d7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">changed_files ≤ 6</text>
      <text x="54" y="102" fill="#9cb2d7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">npm test exitCode = 0</text>
      <rect x="20" y="126" width="154" height="14" rx="7" fill="#132645" />
      <rect x="20" y="126" width="122" height="14" rx="7" fill="url(#accent)" />
    </g>
    <g transform="translate(28 304)">
      <rect width="92" height="28" rx="14" fill="#13203b" />
      <text x="22" y="18" fill="#d9e5fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">JSON</text>
      <rect x="102" width="92" height="28" rx="14" fill="#13203b" />
      <text x="119" y="18" fill="#d9e5fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">HTML</text>
    </g>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" opacity="0.95">
    <path d="M332 397h30" />
    <path d="M610 397h30" />
    <path d="M910 397h30" />
  </g>
  <g fill="url(#accent)">
    <path d="M362 387l18 10-18 10z" />
    <path d="M640 387l18 10-18 10z" />
    <path d="M940 387l18 10-18 10z" />
  </g>
</svg>
