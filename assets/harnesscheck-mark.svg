<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">HarnessCheck mark</title>
  <desc id="desc">A rounded dark tile with a grid, a bright check, and path-like connector lines representing deterministic agent verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020" />
      <stop offset="100%" stop-color="#111a33" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#61dafb" />
      <stop offset="100%" stop-color="#7c5cff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#050812" flood-opacity="0.45" />
    </filter>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="40" fill="url(#bg)" filter="url(#shadow)" />
  <rect x="48" y="48" width="160" height="160" rx="28" fill="#0f1730" stroke="#243257" stroke-width="2" />
  <g opacity="0.55" stroke="#23304f" stroke-width="2">
    <path d="M88 56v144" />
    <path d="M128 56v144" />
    <path d="M168 56v144" />
    <path d="M56 88h144" />
    <path d="M56 128h144" />
    <path d="M56 168h144" />
  </g>
  <g fill="#0d1630" stroke="#2f4578" stroke-width="2">
    <rect x="68" y="68" width="20" height="20" rx="6" />
    <rect x="108" y="68" width="20" height="20" rx="6" />
    <rect x="148" y="68" width="20" height="20" rx="6" />
    <rect x="68" y="108" width="20" height="20" rx="6" />
    <rect x="108" y="108" width="20" height="20" rx="6" />
    <rect x="148" y="108" width="20" height="20" rx="6" />
  </g>
  <path d="M78 159l24 24 58-66" fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round" stroke-width="16" />
  <circle cx="176" cy="164" r="12" fill="#61dafb" opacity="0.95" />
  <circle cx="176" cy="164" r="24" fill="none" stroke="#61dafb" opacity="0.22" stroke-width="8" />
