<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">HarnessCheck report demo</title>
  <desc id="desc">A stylized report preview showing pass-fail summary, trial rows, and changed-file evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7faff" />
      <stop offset="100%" stop-color="#eef3fb" />
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#30d69b" />
      <stop offset="100%" stop-color="#37b6d8" />
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8c5b" />
      <stop offset="100%" stop-color="#ff5f7a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#b8c4db" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)" />
  <g transform="translate(88 76)">
    <text x="0" y="54" fill="#111a31" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="820">Report preview</text>
    <text x="0" y="92" fill="#5b6d8c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">Illustrative output for CI artifacts, PR review, and regression triage</text>
  </g>
  <g transform="translate(88 156)" filter="url(#shadow)">
    <rect width="1224" height="648" rx="32" fill="#ffffff" stroke="#dde6f4" />
    <g transform="translate(40 34)">
      <rect width="260" height="112" rx="24" fill="#0f1930" />
      <text x="26" y="42" fill="#dfe9ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Suite</text>
      <text x="26" y="82" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="800">todo-api regressions</text>
      <rect x="286" width="202" height="112" rx="24" fill="#f5f9ff" stroke="#dfe8f6" />
      <text x="312" y="42" fill="#53657f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Pass rate</text>
      <text x="312" y="82" fill="#111a31" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="800">87.5%</text>
      <rect x="514" width="184" height="112" rx="24" fill="#f5f9ff" stroke="#dfe8f6" />
      <text x="540" y="42" fill="#53657f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Trials</text>
      <text x="540" y="82" fill="#111a31" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="800">16</text>
      <rect x="724" width="184" height="112" rx="24" fill="#f5f9ff" stroke="#dfe8f6" />
      <text x="750" y="42" fill="#53657f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Failures</text>
      <text x="750" y="82" fill="#111a31" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="800">2</text>
    </g>
    <g transform="translate(40 190)">
      <rect width="1144" height="50" rx="18" fill="#eef3fb" />
      <text x="24" y="32" fill="#4f617f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">CASE</text>
      <text x="366" y="32" fill="#4f617f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">AGENT</text>
      <text x="540" y="32" fill="#4f617f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">STATUS</text>
      <text x="700" y="32" fill="#4f617f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">CHANGED FILES</text>
      <text x="930" y="32" fill="#4f617f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">DURATION</text>
    </g>
    <g transform="translate(40 258)">
      <rect width="1144" height="72" rx="22" fill="#fbfdff" stroke="#e7edf8" />
      <text x="24" y="44" fill="#111a31" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">adds-health-endpoint</text>
      <text x="366" y="44" fill="#40587e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">codex</text>
      <rect x="526" y="20" width="102" height="32" rx="16" fill="url(#ok)" />
      <text x="555" y="41" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800">PASS</text>
      <text x="700" y="44" fill="#40587e" font-family="JetBrains Mono, ui-monospace, monospace" font-size="17">3 files</text>
      <text x="930" y="44" fill="#40587e" font-family="JetBrains Mono, ui-monospace, monospace" font-size="17">18.4s</text>
    </g>
    <g transform="translate(40 344)">
      <rect width="1144" height="72" rx="22" fill="#fbfdff" stroke="#e7edf8" />
      <text x="24" y="44" fill="#111a31" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">adds-health-endpoint</text>
      <text x="366" y="44" fill="#40587e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">claude</text>
      <rect x="526" y="20" width="102" height="32" rx="16" fill="url(#warn)" />
      <text x="554" y="41" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800">FAIL</text>
      <text x="700" y="44" fill="#40587e" font-family="JetBrains Mono, ui-monospace, monospace" font-size="17">8 files</text>
      <text x="930" y="44" fill="#40587e" font-family="JetBrains Mono, ui-monospace, monospace" font-size="17">31.9s</text>
    </g>
    <g transform="translate(40 458)">
      <text x="0" y="0" fill="#4f617f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">FAILED TRIAL EVIDENCE</text>
      <rect y="24" width="1144" height="146" rx="24" fill="#0f1830" />
      <text x="26" y="58" fill="#dbe8ff" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15">ASSERTION: changed_files include=[src/**, test/**] max=6</text>
      <text x="26" y="90" fill="#ffb5c1" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15">RESULT: observed 8 changed files</text>
      <rect x="26" y="112" width="1092" height="14" rx="7" fill="#1f2c4d" />
      <rect x="26" y="112" width="910" height="14" rx="7" fill="url(#warn)" />
    </g>
  </g>
</svg>
